spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://mysql:3306/citas_fcv_training}
    username: ${DB_USERNAME:${DB_USER:citas_app}}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 4
app:
  security:
    access-secret: test-access-secret-must-be-at-least-32-bytes-long
    refresh-secret: test-refresh-secret-must-be-at-least-32-bytes-long
    access-ttl: PT30M
    refresh-ttl: P14D
    refresh-cookie-secure: true
  cors:
    allowed-origins: http://localhost:3000
