spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/citas}
    username: ${DB_USERNAME:citas}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
app:
  security:
    access-secret: ${JWT_ACCESS_SECRET}
    refresh-secret: ${JWT_REFRESH_SECRET}
    access-ttl: PT30M
    refresh-ttl: P14D
    refresh-cookie-secure: true
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
